<div class="container">
  <h1>Demande d'inscription</h1>
  <form id="signupForm" class="needs-validation" novalidate>
    <div class="row g-3">
      <div class="col-sm-12">
        <label for="firstName" class="form-label">Prénom</label>
        <input type="text" class="form-control" id="firstName" required>
        <div class="invalid-feedback">
          Le prénom est requis.
        </div>
      </div>
      <div class="col-sm-12">
        <label for="lastName" class="form-label">Nom</label>
        <input type="text" class="form-control" id="lastName" placeholder="" value="" required>
        <div class="invalid-feedback">
          Le nom est requis.
        </div>
      </div>
      <div class="col-sm-12">
        <label for="pseudo" class="form-label">Pseudo</label>
        <input type="text" class="form-control" id="pseudo"  value="" required>
        <div class="invalid-feedback">
          Le pseudo est requis.
        </div>
      </div>
      <div class="col-sm-12">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email"  value="" required>
        <div class="invalid-feedback">
          L'email est requis. ex: xxxxxx@xxx.xxx
        </div>
      </div>
      <div class="col-7">

        <label for="birthDate" class="form-label">
          Date de naissance <span class="text-primary fs-6">(age >= 13)</span>
        </label>
        <input type="date" class="form-control" id="birthDate"  required>
        <div class="invalid-feedback">
          La date doit être inférieur à <span id="dateLimitError"></span>.
        </div>
      </div>
      <hr class="my-4"/>

      <div class="col-sm-12">
        <label for="channel" class="form-label">Nom de ma chaine</label>
        <input type="text" class="form-control" id="channel"  value="" required>
        <div class="invalid-feedback">
          le nom de chaine est requis.
        </div>
      </div>
      <button id="cancelBtn" type="button" class="btn btn-secondary" >Annuler</button>
      <button id="submitBtn" type="button" class="btn btn-primary">Enregistrer</button>
    </div>
  </form>
  <div class="text-center pt-3">
    <a href="/signin">Vous avez déjà un compte ? Connectez-vous ici !</a>
  </div>
</div>

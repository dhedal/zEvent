
<div class="container">
  <div id="formCarousel" class="carousel slide" data-bs-ride="false" data-bs-interval="false" >
    <div class="carousel-inner">
<!--      SIGNIN CAROUSEL ITEM -->
      <div class="carousel-item active">
        <h1>Connexion</h1>
        <form id="signinForm">
          <div class="mb-3">
            <label for="emailId" class="form-label">Email</label>
            <input type="email" class="form-control" id="emailId">
            <div class="invalid-feedback">
              <p>le mail ou le mot de passe ne correspondent pas.</p>
            </div>
          </div>
          <div class="mb-3">
            <label for="passwordId" class="form-label">Mot de passe</label>
            <input type="password" class="form-control" id="passwordId" >
          </div>
          <div class="text-center">
            <button type="button" class="btn btn-primary" id="signinSubmit">Connexion</button>
          </div>
        </form>
        <div class="text-center pt-3">
          <a href="/signup">Vous n’avez pas de compte ? Inscrivez-vous ici !</a>
        </div>
        <div class="text-center pt-3">
          <button class="btn btn-link" id="forgotPasswordTabBtn" data-bs-target="#formCarousel" data-bs-slide="next">J'ai oublié mon mot de passe</button>
        </div>
      </div>
      <!--      FORGOT-PASSWORD CAROUSEL ITEM -->
      <div class="carousel-item">
        <h1>Réinitialiser votre mot de passe</h1>
        <form id="forgotPasswordForm">
          <div class="mb-3">
            <label for="emailFP" class="form-label">Email</label>
            <input type="email" class="form-control" id="emailFP">
            <div class="invalid-feedback">
              <p>le mail ou le mot de passe ne correspondent pas.</p>
            </div>
          </div>
          <div class="text-center pt-3">
            <button type="button" id="forgotPasswordSubmit" class="btn btn-outline-primary">Envoyer</button>
          </div>
          <div class="text-center pt-3">
            <button id="forgotPasswordCancelBtn" class="btn btn-outline-warning" data-bs-target="#formCarousel" data-bs-slide="prev">Annuler</button>
          </div>
        </form>
      </div>
    </div>
  </div>

</div>

<div class="container">
  <h1>Créer un nouveau mot de passe</h1>
  <form id="signinForm">
    <small class="col-sm-12 text-primary">
      <p>Le mot de passe doit contenir </p>
      <ul>
        <li class="form-control" id="charLengthError"><span class="fs-6">au moin 8 charactères</span></li>
        <li class="form-control" id="charUpperLowerError">des majuscules, des minuscules</li>
        <li class="form-control" id="charNumberError">au moin un chiffre</li>
        <li class="form-control" id="charSpecialError">au moin un charactère spécial : !@#$%&*?:+-</li>
      </ul>
    </small>
    <div class="col-sm-12">
      <label for="passwordId" class="form-label">Mot de passe</label>
      <input type="password" class="form-control" id="passwordId"  required>
    </div>
    <div class="col-sm-12">
      <label for="password2" class="form-label">Ressaisir le mot de passe</label>
      <input type="password" class="form-control" id="password2" required>
    </div>
  </form>
  <div class="text-center pt-3">
    <a href="/signup">Vous n’avez pas de compte ? Inscrivez-vous ici !</a>
  </div>
</div>

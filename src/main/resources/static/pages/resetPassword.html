<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Z-Event</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@300;400&display=swap" />
    <link rel="stylesheet" href="../scss/main.css" type="text/css"/>
</head>
<body>
    <div class="container">
        <div id="message"></div>


        <div id="formContent" class=" invisible">
            <h1>Réinitialiser votre mot de passe</h1>
            <form id="resetPasswordForm">
                <small class="col-sm-6 text-primary">
                    <p>Le mot de passe doit contenir </p>
                    <ul class="col-sm-6">
                        <li class="form-control" id="charLengthError"><span class="fs-6">au moin 8 charactères</span></li>
                        <li class="form-control" id="charUpperLowerError">des majuscules, des minuscules</li>
                        <li class="form-control" id="charNumberError">au moin un chiffre</li>
                        <li class="form-control" id="charSpecialError">au moin un charactère spécial : !@#$%&*?:+-</li>
                    </ul>
                </small>
                <div class="col-sm-6">
                    <label for="password" class="form-label">Mot de passe</label>
                    <input type="password" class="form-control" id="password"  required>
                </div>
                <div class="col-sm-6">
                    <label for="passwordCopy" class="form-label">Ressaisir le mot de passe</label>
                    <input type="password" class="form-control" id="passwordCopy" required>
                </div>
                <div class="col-sm-6">
                    <button id="submitBtn" class="btn btn-outline-primary">Réinitialiser</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import {} from '../js/pages/resetPassword.js'
    </script>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
